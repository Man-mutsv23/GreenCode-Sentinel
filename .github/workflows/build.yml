name: Build Cross-Platform Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: GreenCode-Sentinel-Windows.exe
            command: pyinstaller --onefile --noconsole --name GreenCode-Sentinel-Windows app/main.py
          - os: macos-latest
            asset_name: GreenCode-Sentinel-macOS
            command: pyinstaller --onefile --noconsole --name GreenCode-Sentinel-macOS app/main.py
          - os: ubuntu-latest
            asset_name: GreenCode-Sentinel-Linux
            command: pyinstaller --onefile --noconsole --name GreenCode-Sentinel-Linux app/main.py

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller flet

      - name: Build Executable
        run: ${{ matrix.command }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/*
