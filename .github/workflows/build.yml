name: Build GreenCode Sentinel

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # Keeps the other builds running if one fails
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgles2-mesa-dev libx11-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev libxxf86vm-dev libasound2-dev pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "flet[all]"

      - name: Build with Flet (Windows)
        if: runner.os == 'Windows'
        run: |
          flet build windows
        shell: pwsh

      - name: Build with Flet (macOS)
        if: runner.os == 'macOS'
        run: |
          flet build macos

      - name: Build with Flet (Linux)
        if: runner.os == 'Linux'
        run: |
          flet build linux

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: greencode-sentinel-windows
          path: build/windows/
          retention-days: 30

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: greencode-sentinel-macos
          path: build/macos/
          retention-days: 30

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: greencode-sentinel-linux
          path: build/linux/
          retention-days: 30
