# GreenCode Sentinel - Docker Compose Configuration

version: '3.8'

services:
  greencode-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greencode-sentinel
    ports:
      - "8080:8080"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-pro-preview}
      - GEMINI_THINKING_LEVEL=${GEMINI_THINKING_LEVEL:-high}
      - GEMINI_TEMPERATURE=${GEMINI_TEMPERATURE:-0.1}
      - GEMINI_MAX_TOKENS=${GEMINI_MAX_TOKENS:-4096}
      - APP_PORT=8080
      - DEBUG_MODE=${DEBUG_MODE:-false}
    volumes:
      # Mount .env file for local development
      - ./.env:/app/.env:ro
      # Mount data directory for persistent results
      - ./data/results:/app/data/results
    restart: unless-stopped
    networks:
      - greencode-network

networks:
  greencode-network:
    driver: bridge

